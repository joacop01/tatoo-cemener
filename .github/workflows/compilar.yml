name: Compilar ejecutable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compilar con PyInstaller
        run: python -m PyInstaller TatooCEMENER.spec --noconfirm

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist/TatooCEMENER -DestinationPath TatooCEMENER-windows.zip

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TatooCEMENER-windows
          path: TatooCEMENER-windows.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TatooCEMENER-windows.zip
          generate_release_notes: true

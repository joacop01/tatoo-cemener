name: Compilar ejecutable

# Se compila y publica sola cada vez que se sube un cambio a la app a main.
# La versión sale de APP_VERSION en tatuajes.py.
on:
  push:
    branches: [main]
    paths:
      - "tatuajes.py"
      - "TatooCEMENER.spec"
      - "requirements.txt"
      - "logo_cemener.*"
      - ".github/workflows/compilar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer versión
        id: version
        shell: pwsh
        run: |
          $linea = Select-String -Path tatuajes.py -Pattern '^APP_VERSION = "(.+)"' | Select-Object -First 1
          $v = $linea.Matches[0].Groups[1].Value
          "numero=$v" >> $env:GITHUB_OUTPUT

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compilar con PyInstaller
        run: python -m PyInstaller TatooCEMENER.spec --noconfirm

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist/TatooCEMENER -DestinationPath TatooCEMENER-windows.zip

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.numero }}
          name: Tatoo CEMENER v${{ steps.version.outputs.numero }}
          target_commitish: ${{ github.sha }}
          files: TatooCEMENER-windows.zip
          overwrite_files: true
          make_latest: true
          body: |
            Descargá `TatooCEMENER-windows.zip`, descomprimí la carpeta completa y abrí `TatooCEMENER.exe`.
            Requiere Windows 10 u 11 (64 bits).
